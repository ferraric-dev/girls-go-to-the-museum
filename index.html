<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Girls go to the Museum</title>
<meta name="description" content="Demonstração da página do grupo para as visitas aos museus da Grande Lisboa.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Girls go to the Museum">
<meta property="og:description" content="Demonstração: sugestões, votação e diário das visitas aos museus da Grande Lisboa.">
<meta property="og:type" content="website">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600..800;1,600..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column. The next visit is an admission ticket (date stub + details);
   preparation, photographs and comments hang below it as plain ruled sections. */
:root{
  --bg:#FAF7F4; --surface:#FFFFFF; --surface-2:#F0EAE5; --ink:#33172B; --ink-2:#74626C; --line:#E5DBD5;
  --rosa:#B5175A; --on-rosa:#FFFFFF; --rosa-soft:#FBE6EE; --trim:#F2BFD3;
  --stub:#E9D2A8; --on-stub:#3A1B10; --ouro:#B5852B; --sand:#F4ECE2; --band:#E4D3C0;
  --danger:#B3261E; --scrim:rgba(30,14,24,.6);
  --shadow:0 1px 2px rgba(51,23,43,.06),0 10px 28px rgba(51,23,43,.08);
  --display:"Playfair Display","Didot","Bodoni MT",Georgia,serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17131A; --surface:#221C25; --surface-2:#2E2632; --ink:#F3ECF1; --ink-2:#B9AAB5; --line:#403544;
    --rosa:#FF8DB6; --on-rosa:#2A0A1A; --rosa-soft:#44203A; --trim:#8C4A68;
    --stub:#D8BE8C; --on-stub:#2E1A10; --ouro:#E2B866; --sand:#2D2529; --band:#4A3D3C;
    --danger:#FF9A8F; --scrim:rgba(8,5,9,.76);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#17131A; --surface:#221C25; --surface-2:#2E2632; --ink:#F3ECF1; --ink-2:#B9AAB5; --line:#403544;
    --rosa:#FF8DB6; --on-rosa:#2A0A1A; --rosa-soft:#44203A; --trim:#8C4A68;
    --stub:#D8BE8C; --on-stub:#2E1A10; --ouro:#E2B866; --sand:#2D2529; --band:#4A3D3C;
    --danger:#FF9A8F; --scrim:rgba(8,5,9,.76);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
a{color:var(--rosa)}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}

.demo-bar{background:var(--ink);color:var(--bg);text-align:center;font-size:14px;font-weight:600;padding:8px 16px}
.wrap{max-width:920px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);padding-block:20px 72px;display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{flex:none;width:36px;height:36px;border-radius:50%;background:var(--rosa);color:var(--on-rosa);display:grid;place-items:center;font-size:17px;line-height:1}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--display);font-style:italic;font-weight:700;font-size:25px;line-height:1.1;letter-spacing:-.01em}
.brand-sub{font-size:13px;color:var(--ink-2)}
.top-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.me{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--rosa-soft);color:var(--rosa)}
.azulejo{height:13px;border-top:2px solid var(--trim);background:radial-gradient(circle at 11px 0,var(--trim) 0 10px,transparent 10.6px);background-size:22px 13px}

/* notices */
.notice{background:var(--rosa-soft);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:15px}
.notice p{flex:1 1 240px;min-width:0}
.notice form{display:flex;gap:8px;flex:1 1 260px;min-width:0}

/* buttons and fields */
.btn{border:1px solid var(--rosa);background:var(--rosa);color:var(--on-rosa);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--rosa);border-color:var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.textbtn{border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:4px}
.textbtn:hover{color:var(--ink)}
.textbtn.armed,.btn.armed{color:var(--danger);border-color:var(--danger)}
.btn.ghost.danger{color:var(--danger)}
input[type=text],input[type=url],input[type=date],input[type=time],textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
textarea{resize:vertical;min-height:76px}
::placeholder{color:var(--ink-2);opacity:.8}
.row-form{display:flex;gap:8px;align-items:flex-start}
.row-form input{flex:1}

/* ticket */
.ticket{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.stub{position:relative;background:var(--stub);color:var(--on-stub);padding:22px 24px;min-width:148px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;right:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.stub::before{top:-11px}.stub::after{bottom:-11px}
.stub-wd{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stub-day{font-family:var(--display);font-weight:700;font-size:76px;line-height:.95;font-variant-numeric:lining-nums}
.stub-mo{font-size:14px;font-weight:600}
.stub-time{margin-top:10px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;border-top:1px solid currentColor;padding-top:8px;align-self:stretch}
.ticket-body{border-left:2px dashed var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rosa)}
.ticket h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15px}
.facts dt{color:var(--ink-2);font-weight:600}
.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;font-weight:600}
.rsvp{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.rsvp-q{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rsvp-q span{font-weight:600}
.choice{display:inline-flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.choice button[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosa);color:var(--on-rosa)}
.who{display:flex;flex-direction:column;gap:6px;font-size:14px}
.who-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.who-label{color:var(--ink-2);font-weight:600;min-width:74px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:2px 10px 2px 3px;font-weight:600}
.chip.muted{color:var(--ink-2);font-weight:500}
.av{--c:var(--rosa);flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:var(--surface);font-size:10px;font-weight:700;letter-spacing:.02em}
.ticket.blank .stub-day{font-size:56px}
.ticket.blank .ticket-body{justify-content:center}
.ticket.blank h1{font-size:clamp(24px,4vw,32px)}
.ticket.blank p{color:var(--ink-2);max-width:56ch}
.ticket-actions{display:flex;flex-wrap:wrap;gap:8px}

/* sections */
.detail{display:flex;flex-direction:column;gap:28px}
.back{align-self:flex-start;border:0;background:transparent;color:var(--rosa);font-weight:600;cursor:pointer;padding:0}
.sec{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.sec.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 36px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h2{font-size:19px;font-weight:700;letter-spacing:-.005em}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}
.hint{font-size:14px;color:var(--ink-2);max-width:65ch}
.empty{font-size:14px;color:var(--ink-2);font-style:italic}

.tasks,.notes,.comments{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:flex-start;gap:10px}
.task label{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;cursor:pointer}
.task input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--rosa)}
.task .txt{overflow-wrap:anywhere}
.task.done .txt{text-decoration:line-through;color:var(--ink-2)}
.by{font-size:13px;color:var(--ink-2)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--ink-2);cursor:pointer}
.quick button:hover{color:var(--ink);border-style:solid}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.note .txt,.comment .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--ink-2)}
.meta strong{color:var(--ink);font-size:14px}
.comment{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.comment .av{width:32px;height:32px;font-size:12px;margin-top:2px}
.composer{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.photo{border:0;padding:0;background:var(--surface-2);border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photos .empty{grid-column:1/-1}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 8px;cursor:pointer}
.vrow:hover{border-color:var(--rosa)}
.thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;display:block;background-color:var(--surface-2)}
.thumb.none{background-image:radial-gradient(circle,var(--stub) 0 3px,transparent 3.6px);background-size:14px 14px}
.vrow-name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.vrow-date{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.vrow-go{color:var(--rosa);font-weight:700}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.page-head h1{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.idea{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.vote{display:flex;flex-direction:column;align-items:center;min-width:56px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;cursor:pointer;font-weight:700}
.vote small{font-size:11px;font-weight:600;color:var(--ink-2)}
.vote[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosa);color:var(--on-rosa)}
.vote[aria-pressed="true"] small{color:inherit}
.vote[disabled]{cursor:default}
.idea-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.idea.solo{grid-template-columns:minmax(0,1fr)}
.tag.wait{color:var(--ink-2);background:var(--surface-2)}
.admins{display:flex;flex-direction:column;gap:8px}
.sug-status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.idea-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}

#main{display:flex;flex-direction:column;gap:28px}
#sugs{display:flex;flex-direction:column;gap:28px}
#sugs:empty{display:none}
/* vote */
.poll{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.poll-rows{display:flex;flex-direction:column;gap:14px}
.poll-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.poll-row .heart{min-width:150px}
.poll-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.poll-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-weight:700;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rosa);background:var(--rosa-soft);border-radius:999px;padding:1px 8px}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--rosa);border-radius:0 4px 4px 0}
.poll-n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums lining-nums;min-width:1.2em;text-align:right}
.poll-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:520px){.poll-row{grid-template-columns:minmax(0,1fr) auto}.poll-row .heart{grid-column:1/-1;justify-self:start;order:3}}
/* suggestions */
.sugs{display:flex;flex-direction:column;gap:16px}
.sugs-head{display:flex;flex-direction:column;gap:4px}
.sugs-head h2{font-family:var(--display);font-style:italic;font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
.sug-grid{display:flex;flex-direction:column;gap:16px}
.sug{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.sug-pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.pic{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.pic svg{display:block;width:100%;height:auto;border-radius:14px}
.pic img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .pic{gap:0}
.slot input{font-size:13px;padding:6px 8px}
.slot-btns{display:flex;flex-wrap:wrap;gap:2px 8px}
.pic figcaption{font-size:12px;line-height:1.3;color:var(--ink-2);overflow-wrap:anywhere}
.sug-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.sug h3{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.sug-desc{max-width:62ch}
.sug-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.heart{border:1px solid var(--rosa);background:transparent;color:var(--rosa);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.heart[aria-pressed="true"]{background:var(--rosa);color:var(--on-rosa)}
.heart[disabled]{cursor:default;opacity:.7}
.p-bg{fill:var(--sand)}.p-a{fill:var(--rosa)}.p-b{fill:var(--band)}.p-g{fill:var(--ouro)}.p-k{fill:var(--ink)}.p-w{fill:var(--surface)}
.p-l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-la{fill:none;stroke:var(--rosa);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-lw{fill:none;stroke:var(--surface);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.5 5.5}
@media (max-width:760px){.sug{grid-template-columns:minmax(0,1fr)}}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:var(--scrim)}
.dlg form{display:flex;flex-direction:column;gap:14px;padding:22px}
.dlg h2{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:600}
.field small{font-size:13px;color:var(--ink-2)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:4px}
.dlg-actions div{display:flex;gap:8px;margin-left:auto}
#lightbox{width:min(980px,calc(100vw - 24px));background:var(--surface)}
.lb{display:flex;flex-direction:column}
.lb img{display:block;max-width:100%;max-height:72vh;margin:auto;object-fit:contain}
.lb-stage{background:var(--surface-2);display:grid;place-items:center;min-height:200px}
.lb-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
.lb-bar div{display:flex;gap:6px;align-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:0;margin-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:20}

@media (max-width:620px){
  .ticket{grid-template-columns:minmax(0,1fr)}
  .stub{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 10px;padding:14px 18px;text-align:left}
  .stub::before,.stub::after{top:auto;bottom:-10px}
  .stub::before{left:-10px;right:auto}.stub::after{right:-10px}
  .stub-day{font-size:44px}
  .stub-time{margin:0 0 0 auto;border:0;padding:0;align-self:auto}
  .ticket-body{border-left:0;border-top:2px dashed var(--line);padding:18px}
  .ticket.blank .stub-day{font-size:36px}
  .tabs button{padding:8px 10px;font-size:15px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.vrow,.choice button,.vote{transition:filter .15s,border-color .15s,background-color .15s}
}
</style>

<div class="demo-bar" data-i="demo">Demonstração: podes experimentar tudo. Nada fica guardado e mais ninguém vê.</div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">♥</span>
      <span class="brand-text">
        <span class="brand-name" data-i="brand">Girls go to the Museum</span>
        <span class="brand-sub" data-i="brand_sub">Grande Lisboa, de duas em duas semanas</span>

  if (vars) for (const [a,b] of Object.entries(vars)) s = s.split("{"+a+"}").join(b);

};
const $ = id => document.getElementById(id);

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "hidden") e.hidden = true;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false || kid === "") continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function linkify(text){
  const out = [];
  String(text || "").split(/(https?:\/\/[^\s<>"]+)/g).forEach((part, i) => {
    if (i % 2) out.push(h("a", {href: part, target: "_blank", rel: "noopener noreferrer"}, part.replace(/^https?:\/\//, "")));
    else if (part) out.push(part);
  });
  return out;
}

function parse(s){ const [y,m,d] = String(s || "").split("-").map(Number); return new Date(y || 2000, (m || 1) - 1, d || 1); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
const dayDiff = s => Math.round((parse(s) - parse(today())) / 864e5);

const fmt = (s, o) => new Intl.DateTimeFormat(loc(), o).format(parse(s));

const fmtStamp = ms => new Intl.DateTimeFormat(loc(), {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}).format(new Date(ms));
function rel(s){
  const n = dayDiff(s);
  if (n === 0) return t("today");
  if (n === 1) return t("tomorrow");

  return {data: url};
}

function square(src, size){
  const w = src.naturalWidth || src.width, hh = src.naturalHeight || src.height, m = Math.min(w, hh);
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(src, (w - m) / 2, (hh - m) / 2, m, m, 0, 0, size, size); return c;
}
function paintOptPics(){
  $("o-pics").replaceChildren(...[0, 1, 2].map(k => {
    const has = !!S.opt.pics[k];
    const cap = h("input", {type: "text", id: "o-cap-" + k, maxlength: "60", placeholder: t("o_cap"), "aria-label": t("o_cap") + " " + (k + 1)});
    cap.value = S.opt.caps[k] || ""; cap.addEventListener("input", () => { S.opt.caps[k] = cap.value; });
    return h("div", {class: "slot"}, figure(has ? {img: S.opt.pics[k], cap: ""} : {svg: BLANK[k](""), cap: ""}, ""), cap,
      h("div", {class: "slot-btns"},
        h("button", {class: "textbtn", type: "button", onclick: () => { S.opt.slot = k; $("o-file").click(); }}, t("choose")),
        has && h("button", {class: "textbtn", type: "button", onclick: () => { S.opt.pics[k] = ""; paintOptPics(); }}, t("remove"))));
  }));
}
function openOptionForm(i){
  S.opt = {id: i ? i.id : null, pics: [0, 1, 2].map(k => (i && i.pics && i.pics[k]) || ""), caps: [0, 1, 2].map(k => (i && i.caps && i.caps[k]) || ""), slot: 0};
  $("opt-dlg-title").textContent = i ? t("o_title_edit") : t("o_title_new");
  $("o-name").value = i ? i.name || "" : ""; $("o-tag").value = i ? i.tag || "" : ""; $("o-desc").value = i ? i.desc || i.note || "" : "";
  $("o-addr").value = i ? i.addr || "" : ""; $("o-when").value = i ? i.when || "" : ""; $("o-url").value = i ? i.url || "" : "";
  paintOptPics(); $("opt-dlg").showModal();
}
$("o-file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let src;
  try { src = await loadImage(f); } catch (err){ return toast(t("photo_bad", {name: f.name})); }
  const c = square(src, 480); let q = 0.74, url = c.toDataURL("image/jpeg", q);
  while (url.length > 70000 && q > 0.4){ q -= 0.1; url = c.toDataURL("image/jpeg", q); }
  if (url.length > 70000) url = square(src, 320).toDataURL("image/jpeg", 0.6);
  S.opt.pics[S.opt.slot] = url; paintOptPics();
});
$("opt-cancel").addEventListener("click", () => $("opt-dlg").close());
$("opt-form").addEventListener("submit", async e => {
  e.preventDefault(); if (!S.db) return;
  let url = $("o-url").value.trim(); if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
  const data = {name: $("o-name").value.trim(), tag: $("o-tag").value.trim(), desc: $("o-desc").value.trim(), addr: $("o-addr").value.trim(), when: $("o-when").value.trim(), url,
    pics: S.opt.pics.slice(0, 3), caps: S.opt.caps.slice(0, 3).map(x => String(x || "").trim())};
  if (!data.name) return;
  const btn = $("opt-save"); btn.disabled = true;
  const ok = S.opt.id ? await save(S.db.doc("ideas/" + S.opt.id).update(data))
                      : await save(S.db.collection("ideas").doc().set({...data, by: S.key, at: Date.now(), accepted: true}));
  btn.disabled = false;
  if (ok) $("opt-dlg").close();
});

function paintAdmin(){
  const box = $("admin"); if (!box) return;
  const show = S.ready && !S.unavailable && !S.readOnly && isAdmin();
  box.hidden = !show;
  if (!show){ box.replaceChildren(); return; }
  const keys = [...new Set([S.key, ...Object.keys(S.people), ...Object.keys(S.admins).filter(k => S.admins[k])])];
  want(keys);
  box.replaceChildren(h("section", {class: "sec"},
    h("div", {class: "group"}, h("h2", null, t("admin_h")), h("p", {class: "hint"}, t("admin_p"))),
    h("ul", {class: "admins"}, keys.map(k => {
      const on = !!S.admins[k], owner = k === S.key && S.isOwner;
      return h("li", {class: "who-line"},
        h("span", {class: "chip"}, avatar(k), nameOf(k) + (k === S.key ? " (" + t("you") + ")" : "")),
        owner ? h("span", {class: "tag"}, t("owner_tag")) : on ? h("span", {class: "tag"}, t("admin_tag")) : null,
        !owner && h("button", {class: "textbtn", type: "button", onclick: () => save(S.db.doc("config/admins").set({keys: {...S.admins, [k]: !on}}))}, on ? t("unmake_admin") : t("make_admin")));
    }))));
}

function render(){
  S.sig = sig();
  applyI18n(); paintNotice(true); paintMe(); paintAdmin();
  const m = $("main"); m.replaceChildren();
  if (S.unavailable){ setDetail(null); m.append(blankTicket(t("signin_h"), t("signin_p"))); return; }
  if (S.view === "visits"){ setDetail(null); m.append(visitsView()); return; }
  const v = currentVisit();
  if (!v){
    setDetail(null);
    m.append(S.view === "visit" && S.ready
      ? blankTicket(t("not_found_h"), t("not_found_p"), [h("button", {class: "btn", type: "button", onclick: () => go("visits")}, t("all_visits"))])
      : noNext());
    if (S.view === "next"){ m.append(h("div", {id: "sugs"}), ideasView()); paintSugs(); paintIdeas(); }
    return;
  }
  setDetail(v.id);
  m.append(detailShell());
  paintTicket(); paintPrep(); paintPhotos(); paintComments(); paintUpNext();
}
function repaint(){
  if (sig() !== S.sig) return render();
  paintNotice(); paintMe(); paintAdmin();
  if (S.view === "visits"){ const m = $("main"); m.replaceChildren(visitsView()); return; }
  paintSugs(); paintIdeas();
  paintTicket(); paintPrep(); paintPhotos(); paintComments(); paintUpNext();
}

/* visit form */
function openVisitForm(v, pre){
  pre = pre || {};
  S.form = {id: v ? v.id : null, fromIdea: pre.fromIdea || null};
  $("visit-dlg-title").textContent = v ? t("edit_visit") : pre.past ? t("add_past") : t("new_visit");
  const last = sorted().slice(-1)[0];
  $("f-museum").value = v ? v.museum || "" : pre.museum || "";
  $("f-date").value = v ? (v.tbc ? "" : v.date || "") : pre.date || "";
  $("f-time").value = v ? v.time || "" : (last && last.time) || "";
  $("f-meet").value = v ? v.meet || "" : "";
  $("f-url").value = v ? v.url || "" : pre.url || "";
  $("f-notes").value = v ? v.notes || "" : pre.notes || "";
  const slot = $("visit-delete-slot"); slot.replaceChildren();
  if (v && S.detailId === v.id) slot.append(confirmBtn(t("del_visit"), "btn ghost danger", async () => {
    const id = v.id, subs = S.sub;
    $("visit-dlg").close();
    for (const k of ["prep", "photos", "comments"]) for (const d of subs[k]){
      await S.db.doc("visits/" + id + "/" + k + "/" + d.id).delete().catch(() => {});
      if (k === "photos" && d.asset && S.assets) S.assets.delete(d.asset).catch(() => {});
    }
    if (await save(S.db.doc("visits/" + id).delete())) go("visits");
  }));
  $("visit-dlg").showModal();
}
$("visit-form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!S.db || !S.form) return;
  let url = $("f-url").value.trim();
  if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
  const data = {museum: $("f-museum").value.trim(), date: $("f-date").value, time: $("f-time").value, meet: $("f-meet").value.trim(), url, notes: $("f-notes").value.trim(), tbc: false};
  if (!data.museum || !data.date) return;
  const btn = $("visit-save"); btn.disabled = true;
  let id = S.form.id, ok;
  if (id) ok = await save(S.db.doc("visits/" + id).update(data));
  else { const ref = S.db.collection("visits").doc(); id = ref.id; ok = await save(ref.set({...data, attendance: {}, by: S.key, at: Date.now()})); }
  btn.disabled = false;
  if (!ok) return;
  if (S.form.fromIdea){
    S.db.doc("ideas/" + S.form.fromIdea).delete().catch(() => {});
    for (const k of Object.keys(S.ballots)) S.db.doc("ballots/" + k).delete().catch(() => {}); /* decided: next round starts clean */
  }
  $("visit-dlg").close();
  if (!S.form.id) go("visit", id);
});
$("visit-cancel").addEventListener("click", () => $("visit-dlg").close());
$("name-cancel").addEventListener("click", () => $("name-dlg").close());
$("me-btn").addEventListener("click", () => { $("f-nick").value = myName(); $("name-dlg").showModal(); });
$("name-form").addEventListener("submit", async e => { e.preventDefault(); if (await saveNick($("f-nick").value)) $("name-dlg").close(); });
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));
$("lightbox").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const n = S.sub.photos.length; if (n < 2) return;
  S.lb = (S.lb + (e.key === "ArrowLeft" ? -1 : 1) + n) % n; paintLightbox();
});
$("photo-input").addEventListener("change", e => { const files = [...e.target.files]; e.target.value = ""; uploadPhotos(files); });
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));
const setLang = l => { lang = l; LS.set("mv.lang", l); render(); };
$("lang-pt").addEventListener("click", () => setLang("pt"));
$("lang-en").addEventListener("click", () => setLang("en"));
window.addEventListener("hashchange", () => { readHash(); render(); });

/* boot */
function guestKey(){
  let k = LS.get("mv.guest");
  if (!k){ k = "g_" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); LS.set("mv.guest", k); }
  return k;
}
/* demonstration only: an in-memory stand-in for the shared store, so the page works as a single file */
function demoClaude(){
  const store = new Map(), subs = []; let n = 0;
  const merge = (a, b) => { for (const k in b){ if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const clone = d => JSON.parse(JSON.stringify(d));
  const docSnap = p => ({id: p.split("/").pop(), exists: store.has(p), data: () => store.has(p) ? clone(store.get(p)) : undefined});
  const colSnap = p => ({docs: [...store.keys()].filter(k => k.startsWith(p + "/") && !k.slice(p.length + 1).includes("/")).map(docSnap)});
  const fire = () => subs.slice().forEach(s => s.cb(s.one ? docSnap(s.p) : colSnap(s.p)));
  const listen = (p, one) => cb => { const s = {p, cb, one}; subs.push(s); setTimeout(() => { if (subs.includes(s)) cb(one ? docSnap(p) : colSnap(p)); }, 0); return () => { const i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); }; };
  const doc = p => ({id: p.split("/").pop(), path: p, onSnapshot: listen(p, true),
    set: async d => { store.set(p, clone(d)); fire(); },
    update: async d => { if (!store.has(p)) throw {code: "invalid_argument"}; merge(store.get(p), clone(d)); fire(); },
    delete: async () => { store.delete(p); fire(); }});
  const collection = p => ({path: p, doc: id => doc(p + "/" + (id || "d" + (++n) + Date.now().toString(36))), onSnapshot: listen(p, false)});
  store.set("visits/gulbenkian", {museum: "Museu Calouste Gulbenkian", date: "2026-09-26", time: "", meet: "", url: "https://gulbenkian.pt/museu/", notes: "", tbc: true, attendance: {}, at: 1});
  store.set("ideas/sug-maat", {name: "MAAT", slug: "maat", at: 1, accepted: true});
  store.set("ideas/sug-tesouro", {name: "Museu do Tesouro Real", slug: "tesouro", at: 2, accepted: true});
  store.set("ideas/sug-paularego", {name: "Casa das Histórias Paula Rego", slug: "paularego", at: 3});
  const user = {me: async () => ({id: "u_demo", name: "", color: "", canEdit: true, isOwner: true}), can: async () => true, profiles: async () => ({})};
  return {use: async k => k === "db" ? {doc, collection} : k === "user" ? user : null};
}
async function boot(){
  readHash(); render();
  const claude = demoClaude();
  if (!claude || typeof claude.use !== "function"){ S.ready = true; S.unavailable = true; return render(); }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const assets = null; /* photos are kept in the shared store, sized for the screen */
  if (!db){ S.ready = true; S.unavailable = true; return render(); }
  S.db = db; S.user = user; S.assets = assets;
  if (user){
    const me = await user.me();
    S.uid = me.id; S.canEdit = !!me.canEdit; S.isOwner = !!me.isOwner; S.canWrite = await user.can("data.write");
    if (me.id){ S.profiles[me.id] = {name: "", color: me.color}; S.asked[me.id] = 1; }
  }
  S.key = S.uid || guestKey();
  S.readOnly = S.canWrite === false && !S.canEdit;
  const fail = e => { if (e && (e.code === "revoked" || e.code === "not_granted")){ S.unavailable = true; render(); } };
  db.collection("visits").onSnapshot(s => { S.visits = s.docs.map(d => ({id: d.id, ...d.data()})); S.ready = true; repaint(); }, fail);
  db.collection("ideas").onSnapshot(s => { S.ideas = s.docs.map(d => ({id: d.id, ...d.data()})); paintSugs(); paintIdeas(); }, fail);
  db.doc("config/admins").onSnapshot(d => { S.admins = (d.exists && d.data().keys) || {}; repaint(); }, fail);
  db.collection("ballots").onSnapshot(s => { S.ballots = {}; s.docs.forEach(d => { S.ballots[d.id] = d.data(); }); paintSugs(); paintIdeas(); }, fail);
  db.collection("people").onSnapshot(s => { S.people = {}; s.docs.forEach(d => { S.people[d.id] = d.data(); }); repaint(); }, fail);
}
boot();
})();
